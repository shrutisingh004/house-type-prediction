<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Room Type Predictor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">

  <header>
    <div class="kicker">NYC OPEN DATA · SHORT-TERM RENTALS</div>
    <h1>What kind of room is this listing?</h1>
    <p class="lede">Enter a listing's details and the model will predict whether it's an entire home, a private room, or a shared room.</p>
  </header>

  <div class="board">
    <section class="panel">
      <h2><span class="dot"></span>LISTING DETAILS</h2>
      <form id="predict-form">
        <div class="field">
          <label for="neighbourhood_group">Borough</label>
          <select id="neighbourhood_group" required>
            <option value="" disabled selected>Select a borough</option>
            <option>Manhattan</option>
            <option>Brooklyn</option>
            <option>Queens</option>
            <option>Bronx</option>
            <option>Staten Island</option>
          </select>
        </div>
        <div class="field">
          <label for="neighbourhood">Neighbourhood</label>
          <input id="neighbourhood" type="text" placeholder="e.g. Williamsburg" required>
        </div>
        <div class="row2">
          <div class="field">
            <label for="latitude">Latitude</label>
            <input id="latitude" type="number" step="any" min="-90" max="90" placeholder="40.7128" required>
          </div>
          <div class="field">
            <label for="longitude">Longitude</label>
            <input id="longitude" type="number" step="any" min="-180" max="180" placeholder="-73.9352" required>
          </div>
        </div>
        <div class="field">
          <label for="price">Price per night ($)</label>
          <input id="price" type="number" step="any" min="0.01" placeholder="150" required>
        </div>

        <div class="row2 advanced">
          <div class="field">
            <label for="minimum_nights">Minimum nights</label>
            <input id="minimum_nights" type="number" min="1" max="365" placeholder="3" required>
          </div>
          <div class="field">
            <label for="availability_365">Available days / yr</label>
            <input id="availability_365" type="number" min="0" max="365" placeholder="180" required>
          </div>
          <div class="field">
            <label for="number_of_reviews">Total reviews</label>
            <input id="number_of_reviews" type="number" min="0" placeholder="24" required>
          </div>
          <div class="field">
            <label for="reviews_per_month">Reviews / month</label>
            <input id="reviews_per_month" type="number" step="any" min="0" placeholder="1.2" required>
          </div>
          <div class="field" style="grid-column:1/3;">
            <label for="calculated_host_listings_count">Host's total listings</label>
            <input id="calculated_host_listings_count" type="number" min="0" placeholder="1" required>
          </div>
        </div>

        <div class="btn-row">
          <button type="submit" class="go" id="go-btn">Predict room type</button>
          <button type="button" class="fill" id="fill-btn">Autofill sample</button>
        </div>
      </form>
    </section>

    <section class="panel">
      <h2><span class="dot"></span>PREDICTION</h2>
      <div class="stub" id="result-area">
        <div class="stub-empty">
          <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M20 4L34 12V28L20 36L6 28V12L20 4Z" stroke="#4B5A66" stroke-width="1.3"/>
            <path d="M20 20L34 12M20 20L6 12M20 20V36" stroke="#4B5A66" stroke-width="1.3"/>
          </svg>
          Fill in the listing details and submit<br>to see the predicted room type.
        </div>
      </div>
    </section>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
